# How Corvis finds models to think with.
#
# 1. THIS DEVICE (default) — models running on the user's own computer through a local
#    model server. Install Ollama (https://ollama.com), then e.g. `ollama pull qwen2.5-coder:7b`.
#    Corvis lists every model the server has. LM Studio, llama.cpp and vLLM work too:
#    point `server` at their OpenAI-compatible address.
# 2. CLOUD (optional) — hosted models. Only used if picked, and they need an API key.

# "auto" picks the best model this device can run; falls back to cloud if none is installed.
default: auto

local:
  server: http://localhost:11434/v1     # Ollama's OpenAI-compatible address

cloud:
  - id: claude-opus-5-5
    label: Claude Opus 5.5
    provider: anthropic
    description: Anthropic cloud model. Needs ANTHROPIC_API_KEY.
    fallbacks: true
    web_tools: true
  - id: claude-sonnet-5-5
    label: Claude Sonnet 5.5
    provider: anthropic
    description: Anthropic cloud model. Needs ANTHROPIC_API_KEY.
    fallbacks: true
    web_tools: true
  # OpenAI renames models often: replace with a current name from
  # https://platform.openai.com/docs/models if this stops working.
  - id: gpt-5
    label: ChatGPT (GPT-5)
    provider: openai
    description: OpenAI cloud model. Needs OPENAI_API_KEY.
