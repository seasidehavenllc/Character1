[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corvis"
version = "0.1.0"
description = "Corvis: a JARVIS-style AI companion with memory, a self-image, and swappable bodies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
chatgpt = ["openai>=3"]
dev = ["pytest>=8"]

[project.scripts]
corvis = "corvis.__main__:main"

[tool.setuptools.packages.find]
include = ["corvis*"]

[tool.setuptools.package-data]
"corvis.web" = ["index.html"]
